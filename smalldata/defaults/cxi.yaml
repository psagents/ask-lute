# SmallData defaults for CXI. Render context for smd.yaml.j2 and smd.dag.j2, on top of
# what default.yaml holds. Every value here is shown to the operator before rendering.
# Source: cxi101933627 (2026-11), LCLS-I DAQ, epix100_1 droplets at 8.9-10.5 keV.
# `daq` is not set here: it is resolved from the run's files (.xtc -> lcls1).

# Per DAG step. Same as default.yaml; a 36 k-event epix100 droplet run took ~1.5-2 min
# on 4 nodes, almost all of it startup.
slurm:
  smd: "--nodes=4 --ntasks-per-node=50 --exclusive"
  analyzer: "--nodes=1 --ntasks-per-node=60"

# Droplets on epix100_1, calibrated to keV: useRms off, thresholds in keV
# (droplets.md, Calibration units). Re-check median(det.gain) and
# median(det.rms * det.gain) if the detector or its calibration changes.
droplet_use_rms: false
# 5 sigma of the pixel noise: median(rms * gain) = 0.17 keV on run 94.
droplet_threshold: 0.85
droplet_threshold_low: 0.85
# Minimum droplet sum, keV (= 60 ADU): ~0.4 photon at 8 keV, ~0.2 at 18 keV. Set from the
# lowest photon energy of the experiment; droplets cut here cannot be recovered.
droplet_thresADU: 3.6
