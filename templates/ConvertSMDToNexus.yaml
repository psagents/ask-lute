# ManagedTask: SMDToNexusConvertor (Executor)
# Converts a smalldata_tools HDF5 file to a CCTBX-compatible NeXuS HDF5 file.
ConvertSMDToNexus:

  # Path to the detector geometry file in DIALS/CCTBX format (.expt). Required.
  geom: ""

  # Path to the input SmallData HDF5 file.
  # Auto-populated to the standard SmallData path for this experiment/run if left empty.
  # input:

  # Path to the output NeXuS HDF5 file.
  # Auto-populated to the standard CCTBX output path for this experiment/run if left empty.
  # output:

  # Flip the detector data axes before writing. Default: false
  # flip:
