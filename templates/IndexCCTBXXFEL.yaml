%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. mfxl1013621)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.2.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 3600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: CCTBXIndexer (Executor)
# Runs cctbx.xfel (DIALS stills_process) for crystallographic indexing of LCLS data.
# Uses the CCP4 CCTBX environment sourced at LCLS.
#
# Part of a 3-stage chain: IndexCCTBXXFEL -> ScaleCCTBXXFEL -> MergeCCTBXXFEL.
# Before filling this in, read references/cctbx-sfx-workflow.md and ask the user
# for: space group, unit cell, a reference/refined detector geometry (if one
# exists for this experiment), and the detector alias (confirm against
# run.detnames, don't guess from the hutch table). Indexing without known
# symmetry (P1) is a valid deliberate choice, but it searches far more candidate
# lattices per image and uses substantially more memory per MPI rank than
# known-symmetry indexing - say so explicitly if defaulting to P1, it changes
# the SLURM resourcing needed as well as the indexing quality.
IndexCCTBXXFEL:

  # LCLS data specification for psana access.
  # Provide data_spec OR an explicit in_file pointing to an existing data location file.
  # Comment out data_spec entirely if supplying in_file directly.
  data_spec:
    # LCLS experiment name. Uses header value by default.
    experiment: "{{ experiment }}"
    # DAQ run number. Uses header value by default.
    run: "{{ run }}"
    # Psana detector address (e.g. "Rayonix", "epix10k2M"). Required.
    detector_address: ""
    # Fixed correction to the nominal beamline wavelength. Optional, independent
    # of input_reference_geometry below (that overrides detector position only,
    # not wavelength). Usually constant across all runs of one experiment - check
    # a prior direct cctbx.xfel.process config for this experiment if one exists.
    # wavelength_offset:
    # Single-shot photon energy calibration (from xfel.fee_calibration, fit from
    # FEE spectrometer notch scans): eV = spectrum_eV_offset + pixel_centroid *
    # spectrum_eV_per_pixel, applied per-event. Optional - omitting these falls
    # back to one fixed wavelength for every shot in the run instead of a true
    # per-shot value (a precision refinement, not required for valid indexing).
    # Always supplied as a matched pair. Consult ask-cctbx-xfel for details.
    # spectrum_eV_per_pixel:
    # spectrum_eV_offset:
    # Raw detector-to-sample distance (mm) for the format reader, e.g.
    # "jungfrau.detz_offset" or "<detector>.detz_offset". Irrelevant/redundant if
    # phil_parameters.input_reference_geometry below is set (that replaces the
    # whole detector model); essential if it is not. data_spec is an open dict -
    # any locator key the psana2 format reader accepts can be added here.
    # <detector>.detz_offset:

  # Path to the input data location file (written from data_spec if provided).
  # Auto-populated to work_dir/data_<exp>_<run>.loc if left empty.
  # in_file:

  # Path to the CCTBX phil configuration file.
  # Auto-populated to work_dir/cctbx_index.phil if left empty.
  # phil_file:

  # Template parameters written into the CCTBX phil file before indexing.
  # Comment out this entire phil_parameters block to skip re-writing the phil file
  # and use phil_file directly.
  phil_parameters:

    # --- Output ---
    # Directory where output files will be placed. Auto-populated from LUTE_WORK_DIR if empty.
    # WARNING: dials.stills_process does NOT create this directory itself - every
    # MPI rank opens a per-rank log file directly inside it and crashes with
    # FileNotFoundError if it's missing. The submission script must `mkdir -p`
    # this path (and the matching Scale/Merge output dirs) before launching.
    # output_output_dir:
    # Save one combined experiment/reflection file per process. Default: true
    # output_composite_output:
    # Directory for log files. Defaults to output_output_dir.
    # output_logging_dir:
    # Logging verbosity: "suppressed" (silences per-image output, recommended for MPI),
    # "normal" (one log file per MPI rank), or "disabled" (no logging). Default: "suppressed"
    # output_logging_option:

    # --- Dispatch ---
    # Attempt to index images. Default: true
    # dispatch_index:
    # Refine experimental models after indexing. Default: false
    # dispatch_refine:
    # Integrate indexed images. Default: true
    # dispatch_integrate:
    # Skip images below a minimum strong-spot count before indexing is attempted.
    # Optional, all three omitted from the rendered phil unless set (falls back to
    # dials.stills_process's own default of enable=true, minimum=16). A minimum of
    # 40 is a commonly-used team convention seen across many production runs on
    # one experiment - check for an existing convention before defaulting to 16.
    # dispatch_hit_finder_enable:
    # dispatch_hit_finder_minimum_number_of_reflections:
    # dispatch_hit_finder_maximum_number_of_reflections:

    # --- Parallelization ---
    # Multiprocessing method: "mpi", "multiprocessing", "sge", "lsf", "pbs". Default: "mpi"
    # mp_method:

    # --- Spot finding ---
    # Path to a bad pixel mask file. Optional.
    # spotfinder_lookup_mask:
    # Flat gain multiplier applied to the detector. Optional.
    # spotfinder_threshold_dispersion_gain:
    # Sigma threshold for classifying a pixel as background in the local area. Default: 6
    # spotfinder_threshold_dispersion_sigma_bkgnd:
    # Sigma threshold for classifying a pixel as a strong spot. Default: 3
    # spotfinder_threshold_dispersion_sigma_strong:
    # Global intensity threshold — pixels below this are always classified as background. Default: 0
    # spotfinder_threshold_dispersion_global_threshold:
    # Size of the local kernel [nx, ny] for sigma estimation. Default: [6, 6]
    # spotfinder_threshold_dispersion_kernel_size:
    # Minimum contiguous pixels required for a spot to pass the filter. Default: 3
    # spotfinder_filter_min_spot_size:
    # Maximum contiguous pixels for a spot to pass the filter. Optional, omitted
    # from the rendered phil unless set.
    # spotfinder_filter_max_spot_size:
    # High-resolution cutoff in Angstroms for spot filtering. Optional.
    # spotfinder_filter_d_min:
    # Spotfinding threshold algorithm: "dispersion", "dispersion_extended", or
    # "radial_profile". Optional - if unset, LUTE never emits an algorithm= line
    # at all, so dials.stills_process silently falls back to its own compiled-in
    # default (dispersion_extended), which is more conservative near already-
    # detected strong pixels and can find fewer spots than plain "dispersion" -
    # with nothing indicating the choice was never actually applied. See
    # references/cctbx-sfx-workflow.md §8 before assuming defaults are fine.
    # spotfinder_threshold_algorithm:

    # --- Indexing ---
    # Refine indexing candidates in the target symmetry (not P1). Default: false
    # indexing_stills_refine_candidates_with_known_symmetry:
    # Refine all indexing candidates instead of only the best by RMSD. Default: true
    # indexing_stills_refine_all_candidates:
    # Target space group for indexing (e.g. "P 41 21 2"). Optional.
    # indexing_known_symmetry_space_group:
    # Target unit cell for indexing (e.g. "140 140 140 90 90 90"). Optional.
    # indexing_known_symmetry_unit_cell:
    # Reference geometry .expt file to use in place of image headers. Optional.
    # input_reference_geometry:
    # Panel origin override [x, y, z] in mm. Requires fast_axis and slow_axis. Optional.
    # geometry_detector_panel_origin:
    # Resolution (d_min) for the initial, low-resolution indexing refinement
    # macrocycle, before subsequent cycles step down toward the full resolution
    # limit - distinct from spotfinder_filter_d_min above. Optional.
    # indexing_refinement_protocol_d_min_start:
    # Maximum number of candidate lattices to search per still image, enabling
    # multi-lattice indexing. Optional, omitted from the rendered phil unless set.
    # indexing_multiple_lattice_search_max_lattices:

    # --- Radial average ---
    # Calculate a radial average of each image — used e.g. to check detector
    # distance calibration against known powder ring positions. All fields
    # optional, omitted from the rendered phil unless explicitly set.
    # radial_average_enable:
    # Low two-theta bound (degrees) for the radial average range.
    # radial_average_two_theta_low:
    # High two-theta bound (degrees) for the radial average range.
    # radial_average_two_theta_high:
    # Verbose output for the radial average calculation. Default: false
    # radial_average_verbose:
    # Output the radial average bins. Default: false
    # radial_average_output_bins:
    # Show plots of the radial average. Default: false
    # radial_average_show_plots:
    # Path to a mask file used when calculating the radial average. Optional,
    # can reuse spotfinder_lookup_mask / integration_lookup_mask.
    # radial_average_mask:

    # --- Integration ---
    # Path to a bad pixel mask file for the integration step, separate from
    # spotfinder_lookup_mask above (spotfinding and integration are masked
    # independently - a mask set only on spotfinder_lookup_mask does NOT also
    # apply during integration). Optional.
    # integration_lookup_mask:
    # Sigma threshold for outlier rejection in background plane fitting. Default: 10
    # integration_background_simple_outlier_plane_n_sigma:
    # Detector gain multiplier for variances after integration of still images. Default: 1.0
    # integration_summation_detector_gain:

    # --- Profile fitting ---
    # Centroid definition for beam divergence: "com" (centre of mass) or "s1". Default: "com"
    # profile_gaussian_rs_centroid_definition:

    # --- Refinement ---
    # Outlier rejection algorithm for refinement. Optional.
    # refinement_reflections_outlier_algorithm:

  # Internal template rendering config. Do not set unless overriding.
  # lute_template_cfg:

  # MPI executable path. Managed by LUTE internally.
  # executable:

  # CCTBX dials.stills_process binary path. Managed by LUTE internally.
  # cctbx_executable:
