%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. mfxl1013621)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.2.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: CCTBXMerger (Executor)
# Runs cctbx.xfel.merge to merge indexed/scaled reflections using the CCTBX framework.
# Uses the CCP4 CCTBX environment sourced at LCLS.
#
# Two common workflows:
#   1. Full pipeline (scale + merge in one step): leave dispatch_step_list commented out.
#      Set input_path to the directory of *_integrated.expt / *_integrated.refl files.
#   2. Merge-only (after a separate CCTBXScaler run): set dispatch_step_list to the
#      merge-only step list shown in the dispatch section below.
#      input_path will be auto-resolved from the ScaleCCTBXXFEL DB entry if left empty.
#
# See references/cctbx-sfx-workflow.md for the required-info checklist and the
# PHIL blank-string gotchas (scaling_model / output_prefix below).
MergeCCTBXXFEL:

  # Path to the CCTBX phil configuration file.
  # Auto-populated to work_dir/cctbx_merge.phil if left empty.
  # phil_file:

  # Template parameters written into the CCTBX phil file before merging.
  # Comment out this entire phil_parameters block to skip re-writing the phil file
  # and use phil_file directly.
  phil_parameters:

    # --- Dispatch ---
    # Step list for the merge-only workflow (after a separate ScaleCCTBXXFEL run).
    # This is the correct default when CCTBXMerger follows CCTBXScaler — running the
    # full pipeline here would re-scale already-scaled data.
    # To run scale+merge in a single job (no prior ScaleCCTBXXFEL), replace with:
    #   input balance model_scaling modify filter scale postrefine statistics_unitcell
    #   statistics_beam model_statistics statistics_resolution group errors_merge
    #   statistics_intensity merge statistics_intensity_cxi
    dispatch_step_list: >-
      input model_scaling statistics_unitcell statistics_beam model_statistics
      statistics_resolution group errors_merge statistics_intensity merge
      statistics_intensity_cxi

    # --- Input ---
    # Path(s) to the directory containing integrated/scaled experiment+reflection files.
    # Auto-resolved from the ScaleCCTBXXFEL DB entry if left empty (merge-only workflow).
    input_path: ""
    # Suffix for experiment files. Default: "_integrated.expt"
    # input_experiments_suffix:
    # Suffix for reflection files. Default: "_integrated.refl"
    # input_reflections_suffix:
    # Parallel file loading method: "uniform" (equal files per rank) or "node_memory"
    # (memory-aware distribution). Default: "uniform"
    # input_parallel_file_load_method:

    # --- Filtering ---
    # Filtering strategy (space-separated list): "n_obs", "resolution", "unit_cell",
    # "energy". Default: "unit_cell"
    # filter_algorithm:

    # Unit cell filtering method: "value" (explicit tolerances around a target cell,
    # recommended first pass) or "cluster" (Mahalanobis distance, requires a covariance
    # file from a prior clustering run). Default: "value"
    # filter_unit_cell_algorithm:

    # -- value-based unit cell filtering (used when filter_unit_cell_algorithm: value) --
    # Target unit cell for value-based filtering (e.g. "78 78 39 90 90 90"). Required
    # when filter_unit_cell_algorithm=value; if omitted, taken from the scaling model.
    # filter_unit_cell_value_target_unit_cell:
    # Fractional tolerance on unit cell lengths (e.g. 0.03 = 3%). Default: 0.03
    # filter_unit_cell_value_relative_length_tolerance:
    # Absolute tolerance on cell angles in degrees. Default: 2.0
    # filter_unit_cell_value_absolute_angle_tolerance:
    # Target space group for value-based filtering (e.g. "P43212"). Default: from model.
    # filter_unit_cell_value_target_space_group:

    # -- cluster-based unit cell filtering (used when filter_unit_cell_algorithm: cluster) --
    # Path to unit cell covariance file (from a prior CCTBX clustering run). Required
    # when filter_unit_cell_algorithm=cluster.
    # WARNING: an empty string "" is invalid PHIL and crashes the parser with
    # "RuntimeError: Missing value for file". Use None or a real path only.
    # filter_unit_cell_cluster_covariance_file:
    # Which covariance component to use. Default: 0
    # filter_unit_cell_cluster_covariance_component:
    # Mahalanobis distance cutoff for unit cell outlier rejection. Default: 5.0
    # filter_unit_cell_cluster_covariance_mahalanobis:

    # Minimum per-image correlation with merged data; images below threshold are rejected.
    # -1.0 disables this filter (recommended for first-pass). Default: -1.0
    # filter_outlier_min_corr:

    # --- Selection ---
    # Per-reflection selection (space-separated list): "panel", "cspad_sensor",
    # "significance_filter", "isolation_forest". Default: "significance_filter"
    # select_algorithm:
    # Remove high-resolution bins until all accepted bins have <I/sigma> >= this value.
    # Default: 0.1
    # select_significance_filter_sigma:

    # --- Scaling ---
    # Scaling algorithm: "mark0" (per-image scaling against a reference model, default)
    # or "mark1" (no scaling / Monte Carlo averaging; requires scaling_unit_cell and
    # scaling_space_group).
    # scaling_algorithm:
    # Path to a reference PDB or MTZ file for mark0 absolute scaling. Ask the user
    # if one exists for this experiment/sample. Keep in sync with ScaleCCTBXXFEL's
    # scaling_model if that task ran first.
    # WARNING: the phil template renders "model = {{ scaling_model }}" unconditionally
    # (no blank-safe guard) - this default dispatch_step_list includes model_scaling,
    # so this field is always used even in merge-only mode. Leaving it "" crashes:
    # RuntimeError: Missing value for model. If there is genuinely no reference
    # model, set this to the literal string "None" (not blank, not omitted).
    # scaling_model:
    # Unit cell for mark1 scaling (e.g. "78 78 39 90 90 90"). Required when
    # scaling_algorithm=mark1.
    # scaling_unit_cell:
    # Space group for mark1 scaling (e.g. "P43212"). Required when
    # scaling_algorithm=mark1.
    # scaling_space_group:
    # Scale merging.d_min by this factor to capture reflections at the detector edge.
    # Default: 0.993420862158964
    # scaling_resolution_scalar:

    # --- Post-refinement ---
    # Enable per-image post-refinement (recommended). Default: true
    # postrefinement_enable:
    # Post-refinement algorithm: "rs" (reciprocal space), "rs2", "rs_hybrid"
    # (analytical derivatives), or "eta_deff". Default: "rs"
    # postrefinement_algorithm:
    # Residual weighting in post-refinement: "unit", "variance", "gentle"
    # (|I|/sigma^2, often best), or "extreme". Default: "unit"
    # postrefinement_target_weighting:

    # --- Merging ---
    # High-resolution cutoff in Angstroms. Required — cctbx default is None and the
    # merge will produce empty output without it. The LUTE model carries a 3.0 safety
    # default but that value is almost certainly not right for your data. Ask the
    # user for a real value; keep in sync with ScaleCCTBXXFEL.merging_d_min.
    merging_d_min: ""
    # Low-resolution cutoff in Angstroms. None = no low-resolution cutoff. Default: None
    # merging_d_max:
    # Merge Bijvoet (Friedel) pairs. Keep false for SAD/MAD to preserve anomalous signal.
    # Default: false
    # merging_merge_anomalous:
    # Apply the data's average unit cell to all crystals before merging. Default: true
    # merging_set_average_unit_cell:
    # Minimum redundancy required to output a merged reflection. Default: 2
    # merging_minimum_multiplicity:
    # Write redundancy as a separate column in the output MTZ. Default: false
    # merging_include_multiplicity_column:
    # Error model: "ha14", "ev11" (Evans 2011, default), "mm24" (Mittan-Moreau 2024),
    # or "errors_from_sample_residuals". Default: "ev11"
    # merging_error_model:
    # Minimizer for the ev11 error model: "lbfgs" or "LevMar". Default: "lbfgs"
    # merging_error_ev11_minimizer:

    # --- Statistics ---
    # Number of resolution shells for statistics output. Default: 20
    # statistics_n_bins:
    # Report per-frame maximum-likelihood statistics. Default: true
    # statistics_report_ML:
    # Reference MTZ file for CC-iso / R-iso calculation. Recommended if a reference
    # structure is available. Default: ""
    # statistics_cciso_mtz_file:
    # Column name in the CCiso reference MTZ for structure factors. Default: "F"
    # statistics_cciso_mtz_column_F:

    # --- Output ---
    # Prefix for all output file names (e.g. "myexp_r0042"). Default: "".
    # WARNING: same blank-string-crashes-PHIL issue as scaling_model above - the
    # template renders "prefix = {{ output_prefix }}" unconditionally. Must be a
    # real non-empty string (content is cosmetic only); never leave it "".
    # output_prefix:
    # Directory where output MTZ and log files are written. Default: "".
    # WARNING: cctbx.xfel.merge does NOT create this directory itself - every MPI
    # rank writes here directly and crashes with FileNotFoundError if it's missing.
    # The submission script must `mkdir -p` this path before launching.
    # output_output_dir:
    # Temporary file directory. Defaults to output_output_dir. Default: ""
    # output_tmp_dir:
    # Log elapsed time for each pipeline step. Default: true
    # output_do_timing:
    # Log verbosity: 0 = log everything; higher values = less logging. Default: 0
    # output_log_level:
    # Save filtered/selected experiment and reflection files alongside MTZ output.
    # Set true when this run will be followed by a merge-only CCTBXMerger step.
    # Default: true
    # output_save_experiments_and_reflections:

    # --- Multiprocessing ---
    # Multiprocessing method. Only "mpi" is currently supported. Default: "mpi"
    # mp_method:
    # Set true when using the integrate worker with psana2/XTC2 data. Default: false
    # mp_psana2_mode:

    # --- Parallel (MPI memory) ---
    # MPI all-to-all communication stride. Set to the number of cores per node
    # (e.g. 64) on large jobs to reduce memory pressure. Default: 1
    # parallel_a2a:

  # Internal template rendering config. Do not set unless overriding.
  # lute_template_cfg:

  # MPI executable path. Managed by LUTE internally.
  # executable:

  # CCTBX cctbx.xfel.merge binary path. Managed by LUTE internally.
  # cctbx_executable:
