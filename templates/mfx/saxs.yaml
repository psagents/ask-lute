%YAML 1.3
# ============================================================
# MFX TR-SAXS/WAXS — PyFAI azimuthal integration + XSSAnalyzer
# Starting point only — verify every field with the user.
# Prerequisite: BayFAI calibration run must be complete (.poni file required).
# Alternative: replace getAzIntPyFAIParams with getAzIntParams (no .poni).
# ============================================================
---
title: "MFX TR-SAXS"                      # optional description
experiment: ""                             # e.g. mfxl1013621 — VERIFY WITH USER
run: ""                                    # auto-populated at runtime; leave empty
date: ""                                   # YYYY/MM/DD
lute_version: 0.3.0
task_timeout: 3600
work_dir: ""                               # e.g. /sdf/data/lcls/ds/mfx/<exp>/results/lute_output — VERIFY WITH USER
---

# ── SmallData production ───────────────────────────────────────────────────────
SubmitSMD:
  # Path to smalldata_tools producer script — VERIFY WITH USER
  producer: "{{ work_dir }}/smalldata_tools/lcls2_producers/smd_producer.py"

  # Template selection — always smd2 for MFX (LCLS-II since Jul 2025)
  lute_template_cfg:
    template_name: "smd2_prod_config_template.py"
    output_path: "{{ work_dir }}/smalldata_tools/lcls2_producers/prod_config_mfx.py"

  # SmallData HDF5 output directory
  directory: ""                           # default: /sdf/data/lcls/ds/mfx/<exp>/hdf5/smalldata — VERIFY WITH USER

  producer_parameters:

    # ── Azimuthal integration via PyFAI ───────────────────────────────────────
    # Requires a .poni file from a prior BayFAI calibration run.
    # If no .poni file exists yet, replace this block with getAzIntParams (manual geometry).
    getAzIntPyFAIParams:
      # Detector alias — VERIFY WITH USER via run.detnames
      jungfrau:                            # rename key to confirmed alias (may be epix10k2M, Rayonix)
        # Path to PyFAI .poni calibration file — FILL IN after BayFAI run
        poni_file: ""                      # e.g. "{{ work_dir }}/geom/r0021.poni"

        # Number of Q bins
        npts: 512

        # Number of azimuthal bins: 1 for isotropic SAXS; >1 for anisotropic / sector analysis
        npts_az: 1

        # Integration units — must be q_A^-1 for SmallDataXSSAnalyzer
        int_units: "q_A^-1"

    # ── IPM / beam intensity monitor ──────────────────────────────────────────
    # Primary I₀ at MFX — VERIFY ALIAS via run.detnames
    # epicsPV:
    #   - ["ipm_dg2", "ipm_dg2"]          # uncomment to save IPM DG2 per shot

    # ── Timetool (pump-probe only) ────────────────────────────────────────────
    # Uncomment when a pump laser is present.
    # ttCalib:
    #   ttCorr: "tt/ttCorr"               # timetool corrected delay
    #   AMPL: "tt/AMPL"                   # edge amplitude; use for quality filtering

    # ── Scan motor positions ───────────────────────────────────────────────────
    # Uncomment PVs to save scan motor positions per shot.
    # epicsArchFilePV:
    #   - "SOME:MOTOR:PV"                 # VERIFY WITH USER

# ── Difference scattering analysis ────────────────────────────────────────────
AnalyzeSmallDataXSS:
  # SmallData HDF5 path — auto-populated from SubmitSMD result; leave empty
  smd_path: ""

  # IPM variable for X-ray intensity filtering — VERIFY WITH USER
  ipm_var: "ipm_dg2/sum"                  # primary I₀ at MFX; verify field exists in HDF5

  # Scan variable for pump-probe delay binning — VERIFY WITH USER
  # scan_var: "lxt"                       # typical delay stage; uncomment and set

  intensity_thresholds:
    # Adjust thresholds to match typical IPM signal range
    # min_ipm: 1000.0                     # uncomment to override default
    # min_Iscat: 10.0                     # uncomment to override default

  xss_processing_parameters: {}           # defaults work for aqueous solution scattering
