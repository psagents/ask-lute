%YAML 1.3
# ============================================================
# MFX XES — X-ray Emission Spectroscopy (Von Hamos ePix100 path)
# Starting point only — verify every field with the user.
# Alternative: Andor integrating spectrometer path documented in comments.
# Von Hamos PVs are MANDATORY — do not omit.
# ============================================================
---
title: "MFX XES"                          # optional description
experiment: ""                             # e.g. mfxl1013621 — VERIFY WITH USER
run: ""                                    # auto-populated at runtime; leave empty
date: ""                                   # YYYY/MM/DD
lute_version: 0.2.0
task_timeout: 3600
work_dir: ""                               # e.g. /sdf/data/lcls/ds/mfx/<exp>/results/lute_output — VERIFY WITH USER
---

# ── SmallData production ───────────────────────────────────────────────────────
SubmitSMD:
  # Path to smalldata_tools producer script — VERIFY WITH USER
  producer: "{{ work_dir }}/smalldata_tools/lcls2_producers/smd_producer.py"

  # Template selection — always smd2 for MFX (LCLS-II since Jul 2025)
  lute_template_cfg:
    template_name: "smd2_prod_config_template.py"
    output_path: "{{ work_dir }}/smalldata_tools/lcls2_producers/prod_config_mfx.py"

  # SmallData HDF5 output directory
  directory: ""                           # default: /sdf/data/lcls/ds/mfx/<exp>/hdf5/smalldata — VERIFY WITH USER

  producer_parameters:

    # ── ROI extraction from XES spectrometer ──────────────────────────────────
    # Confirm detector alias via run.detnames before using.
    # writeArea: true is required — XESAnalyzer needs the 2D frame for projection.
    getROIs:
      # Detector alias — VERIFY WITH USER via run.detnames
      epix100_0:                           # rename key to confirmed alias
        - ROI: [[0, 704], [0, 768]]        # FILL IN — ask user for spectral stripe bounds from AMI
          writeArea: true                  # MANDATORY for XES
          thresADU: null

    # ── Von Hamos spectrometer PVs (MANDATORY — do not omit) ─────────────────
    # These cannot be recovered after the run. Include all 22 PVs.
    epicsArchFilePV:
      - "MFX:SPEC:C1:TILT.RBV"
      - "MFX:SPEC:C1:X.RBV"
      - "MFX:SPEC:C1:ROT.RBV"
      - "MFX:SPEC:C2:TILT.RBV"
      - "MFX:SPEC:C2:X.RBV"
      - "MFX:SPEC:C2:ROT.RBV"
      - "MFX:SPEC:C3:TILT.RBV"
      - "MFX:SPEC:C3:X.RBV"
      - "MFX:SPEC:C3:ROT.RBV"
      - "MFX:SPEC:C4:TILT.RBV"
      - "MFX:SPEC:C4:X.RBV"
      - "MFX:SPEC:C4:ROT.RBV"
      - "MFX:SPEC:C5:TILT.RBV"
      - "MFX:SPEC:C5:X.RBV"
      - "MFX:SPEC:C5:ROT.RBV"
      - "MFX:SPEC:C6:TILT.RBV"
      - "MFX:SPEC:C6:X.RBV"
      - "MFX:SPEC:C6:ROT.RBV"
      - "MFX:SPEC:ROT.RBV"
      - "MFX:SPEC:T1.RBV"
      - "MFX:SPEC:T2.RBV"
      - "MFX:SPEC:T3.RBV"

    # ── DCCM monochromator PVs (uncomment if CCM is in use) ───────────────────
    # epicsPV:
    #   - ["SP1L0:DCCM:*", "ccm_*"]      # VERIFY IF DCCM is in the beam path

    # ── Timetool (pump-probe only) ────────────────────────────────────────────
    # Uncomment when a pump laser is present.
    # ttCalib:
    #   ttCorr: "tt/ttCorr"               # timetool corrected delay
    #   AMPL: "tt/AMPL"                   # edge amplitude

    # ── Alternative: Andor integrating spectrometer ────────────────────────────
    # Uncomment and replace epix100_0 with Andor alias if using an integrating detector.
    # integrating_detectors:
    #   - "andor_xes"                     # VERIFY ALIAS
    # get_intg:
    #   intg_main: "andor_xes"

# ── XES analysis ───────────────────────────────────────────────────────────────
AnalyzeSmallDataXES:
  # SmallData HDF5 path — auto-populated from SubmitSMD result; leave empty
  smd_path: ""

  # XES detector alias — must match the key used in getROIs above
  xes_detname: "epix100_0"                # VERIFY WITH USER

  # IPM variable for X-ray intensity filtering — VERIFY WITH USER
  ipm_var: "ipm_dg2/sum"                  # primary I₀ at MFX; verify field exists in HDF5

  # Scan variable for pump-probe delay binning — VERIFY WITH USER
  # scan_var: "lxt"                       # uncomment and set: typical delay stage at MFX

  # Axis projection: false = project along axis 1 (columns = dispersive axis for most setups)
  # invert_xes_axes: false                # uncomment and set true if spectrum is transposed

  intensity_thresholds:
    # Adjust thresholds to match typical IPM signal range
    # min_ipm: 1000.0                     # uncomment to override default
    # min_Iscat: 10.0                     # uncomment to override default
