# Uses the CCP4-8.0 environment sourced at LCLS.
RunSHELXC:

  # Input file for SHELXC containing merged reflections and proper SHELX records.
  # Auto-populated from the ManipulateHKL XDS-format output if left empty.
  # in_file:

  # Placeholder filename stem used by SHELXC for all output files. Default: "xx"
  # placeholder:

  # CCP4 SHELXC binary path. Managed by LUTE internally.
  # executable:
