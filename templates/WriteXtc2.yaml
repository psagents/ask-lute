%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. xpptut15)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.3.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 3600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: Xtc2Writer (MPIExecutor — psana2 environment)
# Receives event data from Xtc1Reader via ZMQ and writes it to XTC2 chunk files.
#
# REQUIREMENTS:
#   - MUST be submitted in parallel with Xtc1Reader (both tasks in the same DAG at root level)
#   - ntasks-per-node MUST be identical for Xtc1Reader and Xtc2Writer
#   - This task runs in the psana2 (conda2) environment automatically via shell_source()
#
# OUTPUT FILE NAMING RULES:
#   1. Filename must follow psana2 convention: <exp>-r<run:04d>-s000-c000.xtc2
#   2. Path must include psana2 search structure: <hutch>/<experiment>/xtc/<filename>
#   3. Example: /my/path/mfx/mfx12345/xtc/mfx12345-r0042-s000-c000.xtc2
#   4. Provide only the c000 filename — LUTE generates cXXX chunk files automatically.
#
# DAG example (see also ReadXtc1.yaml):
#   !LUTE_DAG
#   - task_name: "Xtc1Reader"
#     slurm_params: "--nodes=1 --tasks-per-node=11 --partition=milano --account=lcls:<EXP>"
#     next: []
#   - task_name: "Xtc2Writer"
#     slurm_params: "--nodes=1 --tasks-per-node=11 --partition=milano --account=lcls:<EXP>"
#     next: []
WriteXtc2:

  # Where to write the output XTC2 file (chunk 0). See naming rules above. Required.
  output_file: ""

  # Node ID for the detector in the XTC2 file. Default: "1" — leave as-is for most uses.
  # node_id: "1"

  # MUST be identical to the xtc1_access_pattern in ReadXtc1.
  # Required — at least one detector entry must be provided.
  xtc1_access_pattern:
    # Example: converting a Jungfrau 1M detector
    # jungfrau1M:
    #   - xtc2_attr_name: "calib"
    #     object_name: "jungfrau1M"
    #     object_type: "psana.Detector"
    #     object_field_name: "calib"
    <detector_name>:
      - xtc2_attr_name: ""       # Must match corresponding entry in ReadXtc1
        object_name: ""
        object_type: "psana.Detector"
        object_field_name: ""
