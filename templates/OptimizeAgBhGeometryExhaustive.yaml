%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. mfxl1013621)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.2.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: AgBhGeometryOptimizer (MPIExecutor)
# Optimizes detector distance and beam center using Ag Behenate powder diffraction data.
# Performs an exhaustive grid search over the parameter space; one iteration per MPI rank.
OptimizeAgBhGeometryExhaustive:

  # Name of the detector to optimize geometry for (e.g. "epix10k2M"). Required.
  detname: ""

  # Directory where the optimized geometry files will be written. Required.
  geom_out_dir: ""

  # Path to the powder diffraction image or SmallData file containing it.
  # Auto-populated from the SmallData path for this experiment/run if left empty.
  # powder:

  # Path to a detector mask file or SmallData file containing it. Optional.
  # mask:

  # Number of Ag Behenate rings to use in the optimization. Default: 4
  # n_peaks:

  # Number of optimization iterations per MPI rank. Default: 5
  # n_iterations:

  # Pixels with intensity above this threshold are zeroed before fitting. Default: 1e6
  # threshold:

  # Search range for beam center x as (left_offset, right_offset, num_steps) in pixels. Default: [-6, 6, 5]
  # dx:

  # Search range for beam center y as (up_offset, down_offset, num_steps) in pixels. Default: [-6, 6, 5]
  # dy:

  # Initial guess for beam center (x, y) in pixels. Optional.
  # center_guess:

  # Initial guess for detector distance in mm. Optional.
  # distance_guess:
