%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. mfxl1013621)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.3.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: CCTBXScaler (Executor)
# Runs cctbx.xfel.merge with a scaling-only step list to produce scaled .expt/.refl files
# without performing the final statistical merge. The output directory is stored in the LUTE
# database so that a downstream CCTBXMerger task can auto-resolve input_path from it.
# Uses the CCP4 CCTBX environment sourced at LCLS.
#
# Typical use: run CCTBXScaler first, inspect unit cell statistics, then run CCTBXMerger
# in merge-only mode (set dispatch_step_list in MergeCCTBXXFEL accordingly).
ScaleCCTBXXFEL:

  # Path to the CCTBX phil configuration file.
  # Auto-populated to work_dir/cctbx_scale.phil if left empty.
  # phil_file:

  # Output directory for scaled files. Populated automatically from
  # phil_parameters.output_output_dir and stored in the LUTE database so that a
  # downstream CCTBXMerger task can auto-resolve input_path.
  # result_output_dir:

  # Template parameters written into the CCTBX phil file before scaling.
  # Comment out this entire phil_parameters block to skip re-writing the phil file
  # and use phil_file directly.
  phil_parameters:

    # --- Dispatch ---
    # Pipeline steps for the scaling-only workflow (space-separated).
    # Default runs: input balance model_scaling modify filter scale postrefine
    # statistics_unitcell statistics_beam model_statistics statistics_resolution
    # Override to add or remove steps (e.g. drop "balance" for small jobs).
    # dispatch_step_list:

    # --- Input ---
    # Path(s) to the directory containing integrated experiment+reflection files
    # (*_integrated.expt / *_integrated.refl). Accepts a single path or a list
    # of paths for multi-run scaling. Required.
    input_path: ""
    # Suffix for experiment files. Default: "_integrated.expt"
    # input_experiments_suffix:
    # Suffix for reflection files. Default: "_integrated.refl"
    # input_reflections_suffix:
    # Parallel file loading method: "uniform" (equal files per rank) or "node_memory"
    # (memory-aware distribution). Default: "uniform"
    # input_parallel_file_load_method:

    # --- Filtering ---
    # Filtering strategy (space-separated list): "n_obs", "resolution", "unit_cell",
    # "energy". Default: "unit_cell"
    # filter_algorithm:

    # Unit cell filtering method: "value" (explicit tolerances around a target cell,
    # recommended first pass) or "cluster" (Mahalanobis distance, requires a covariance
    # file from a prior clustering run). Default: "value"
    # filter_unit_cell_algorithm:

    # -- value-based unit cell filtering (used when filter_unit_cell_algorithm: value) --
    # Target unit cell for value-based filtering (e.g. "78 78 39 90 90 90"). Required
    # when filter_unit_cell_algorithm=value; if omitted, taken from the scaling model.
    # filter_unit_cell_value_target_unit_cell:
    # Fractional tolerance on unit cell lengths (e.g. 0.03 = 3%). Default: 0.03
    # filter_unit_cell_value_relative_length_tolerance:
    # Absolute tolerance on cell angles in degrees. Default: 2.0
    # filter_unit_cell_value_absolute_angle_tolerance:
    # Target space group for value-based filtering (e.g. "P43212"). Default: from model.
    # filter_unit_cell_value_target_space_group:

    # -- cluster-based unit cell filtering (used when filter_unit_cell_algorithm: cluster) --
    # Path to unit cell covariance file (from a prior CCTBX clustering run). Required
    # when filter_unit_cell_algorithm=cluster.
    # WARNING: an empty string "" is invalid PHIL and crashes the parser with
    # "RuntimeError: Missing value for file". Use None or a real path only.
    # filter_unit_cell_cluster_covariance_file:
    # Which covariance component to use. Default: 0
    # filter_unit_cell_cluster_covariance_component:
    # Mahalanobis distance cutoff for unit cell outlier rejection. Default: 5.0
    # filter_unit_cell_cluster_covariance_mahalanobis:

    # Minimum per-image correlation with merged data; images below threshold are rejected.
    # -1.0 disables this filter (recommended for first-pass). Default: -1.0
    # filter_outlier_min_corr:

    # --- Selection ---
    # Per-reflection selection (space-separated list): "panel", "cspad_sensor",
    # "significance_filter", "isolation_forest". Default: "significance_filter"
    # select_algorithm:
    # Remove high-resolution bins until all accepted bins have <I/sigma> >= this value.
    # Default: 0.1
    # select_significance_filter_sigma:

    # --- Scaling ---
    # Scaling algorithm: "mark0" (per-image scaling against a reference model, default)
    # or "mark1" (no scaling / Monte Carlo averaging; requires scaling_unit_cell and
    # scaling_space_group).
    # scaling_algorithm:
    # Path to a reference PDB or MTZ file for mark0 absolute scaling. Leave empty for
    # internal KB/Wilson scaling. Default: ""
    # scaling_model:
    # Unit cell for mark1 scaling (e.g. "78 78 39 90 90 90"). Required when
    # scaling_algorithm=mark1.
    # scaling_unit_cell:
    # Space group for mark1 scaling (e.g. "P43212"). Required when
    # scaling_algorithm=mark1.
    # scaling_space_group:
    # Scale merging.d_min by this factor to capture reflections at the detector edge.
    # Default: 0.993420862158964
    # scaling_resolution_scalar:

    # --- Merging resolution ---
    # High-resolution cutoff in Angstroms. Required — cctbx default is None and
    # xfel.merge uses it to define the resolution grid even in scaling-only mode.
    # The LUTE model carries a 3.0 safety default but that value is almost certainly
    # not right for your data.
    merging_d_min: ""
    # Merge Bijvoet (Friedel) pairs during scaling. Keep false for SAD/MAD experiments.
    # Default: false
    # merging_merge_anomalous:

    # --- Output ---
    # Prefix for output file names (e.g. "scaling_r0036"). Default: ""
    # output_prefix:
    # Directory for scaled output files. This path is stored in the LUTE database so
    # CCTBXMerger can auto-resolve input_path from it. Required.
    output_output_dir: ""
    # Save scaled experiment and reflection files. Must be true for the output to be
    # usable by a downstream CCTBXMerger task. Default: true
    # output_save_experiments_and_reflections:
    # Log elapsed time for each pipeline step. Default: true
    # output_do_timing:
    # Log verbosity: 0 = log everything; higher values = less logging. Default: 0
    # output_log_level:

    # --- Statistics ---
    # Number of resolution shells for statistics output. Default: 20
    # statistics_n_bins:

    # --- Multiprocessing ---
    # Multiprocessing method. Only "mpi" is currently supported. Default: "mpi"
    # mp_method:
    # Set true when using the integrate worker with psana2/XTC2 data. Default: false
    # mp_psana2_mode:

  # Internal template rendering config. Do not set unless overriding.
  # lute_template_cfg:

  # MPI executable path. Managed by LUTE internally.
  # executable:

  # CCTBX cctbx.xfel.merge binary path. Managed by LUTE internally.
  # cctbx_executable:
