%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. mfxl1013621)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.2.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: SmallDataXSSAnalyzer (MPIExecutor)
# Processes XSS (X-ray Scattering) data from a SmallData HDF5 file.
# Calculates difference scattering signal and bins it by scan variables.
AnalyzeSmallDataXSS:

  # Path to the SmallData HDF5 file to analyze.
  # Auto-populated from the SubmitSMD result if left empty.
  smd_path: ""

  # Name of the detector with scattering data (e.g. "epix10k2M"). Optional.
  # Optional — when omitted, the analyzer looks for a scattering detector from prior task
  # results (e.g. SubmitSMD). Provide explicitly when the detector name is not auto-resolved
  # or when processing data from a non-standard detector.
  # xss_detname:

  # IPM variable name for X-ray intensity filtering (e.g. "ipm5/sum"). Required.
  ipm_var: ""

  # Scan variable(s) to bin the signal by. Can be a single string or a list
  # (e.g. "lxt", or ["lxt", "lens_h"]). Optional.
  # Optional — when omitted, the difference scattering signal is averaged over all laser-on shots
  # without binning. Provide when the experiment scans a time delay or other variable so the
  # signal can be resolved as a function of that parameter.
  # scan_var:

  # List of event codes to filter on for T-Jump XSS analysis. Optional.
  # Optional — most XSS experiments do not need event code filtering.
  # Provide when the DAQ records multiple interleaved event types (e.g. laser-on, laser-off,
  # and reference shots) and only specific event codes should be analysed.
  # xss_event_codes:

  # Intensity thresholds for filtering low-quality shots.
  # Uncomment the sub-fields to override the defaults; all sub-fields are optional.
  intensity_thresholds:
    # Minimum integrated scattering intensity — shots below this are rejected. Default: 10.0
    # Optional — set lower if scattering signal is weak, or higher to reject more bad shots.
    # min_Iscat:
    # Minimum X-ray intensity measured by the IPM — shots below this are rejected. Default: 1000.0
    # Optional — adjust to match the typical IPM signal range for this experiment.
    # min_ipm:

  # Parameters controlling XSS data processing.
  # All sub-fields are optional — the defaults work well for aqueous solution scattering.
  # Uncomment only the fields you need to tune.
  xss_processing_parameters:
    # Q-range [qmin, qmax] used for normalization of the scattering signal. Default: [0.9, 3.5]
    # Optional — adjust when the solvent background peaks fall outside this Q-window.
    # q_norm:
    # Size of the median filter applied to scattering profiles. Default: 12
    # Optional — increase to smooth noisy profiles; decrease if fine features are being washed out.
    # median_filter_size:
    # Q-range [qmin, qmax] used to identify the water peak. Default: [1.0, 1.93]
    # Optional — adjust when the solvent is not water or the water peak position shifts (e.g. heavy water).
    # water_qs:
    # Ratio of water peak intensity (low Q / high Q) threshold for filtering bad water shots. Default: 1.25
    # Optional — raise to be more stringent about rejecting shots where the water peak looks wrong.
    # water_ratio:
    # Standard deviation threshold for filtering bad water shots. Default: 2.0
    # Optional — increase to keep more shots; decrease to reject more outliers.
    # water_sigma:
    # Number of bins for total-intensity-based sub-sampling. Default: 20
    # Optional — increase for finer intensity binning; decrease for coarser grouping.
    # num_intensity_bins:
