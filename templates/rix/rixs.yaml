%YAML 1.3
# ============================================================
# RIX RIXS — ChemRIXS (Andor VLS) and qRIXS (Archon CCD)
# Starting point only — verify every field with the user.
# integrating_detectors is MANDATORY — do not omit.
# For qRIXS: getPressioCompression must appear BEFORE getROIs.
# Uncomment the block for your endstation; comment out the other.
# ============================================================
---
title: "RIX RIXS"                         # optional description
experiment: ""                             # e.g. rixlr1004924 — VERIFY WITH USER
run: ""                                    # auto-populated at runtime; leave empty
date: ""                                   # YYYY/MM/DD
lute_version: 0.3.0
task_timeout: 3600
work_dir: ""                               # e.g. /sdf/data/lcls/ds/rix/<exp>/results/lute_output — VERIFY WITH USER
---

# ── SmallData production ───────────────────────────────────────────────────────
SubmitSMD:
  # Path to smalldata_tools producer script — VERIFY WITH USER
  producer: "{{ work_dir }}/smalldata_tools/lcls2_producers/smd_producer.py"

  # Always LCLS-II at RIX
  lute_template_cfg:
    template_name: "smd2_prod_config_template.py"
    output_path: "{{ work_dir }}/smalldata_tools/lcls2_producers/prod_config_rix.py"

  # SmallData HDF5 output directory
  directory: ""                           # default: /sdf/data/lcls/ds/rix/<exp>/hdf5/smalldata — VERIFY WITH USER

  producer_parameters:

    # ── MANDATORY: integrating detectors ─────────────────────────────────────
    # Without this, psana2 event alignment fails and data is corrupt.
    # Confirm aliases via run.detnames.
    # ChemRIXS path: uncomment the block below.
    # qRIXS path: comment out ChemRIXS block and uncomment qRIXS block.

    # --- ChemRIXS (Andor VLS) ---
    integrating_detectors:
      - "andor_vls"                        # VERIFY ALIAS via run.detnames
      - "andor_norm"                       # normalization Andor — include if in use; VERIFY

    get_intg:
      intg_main: "andor_vls"              # slowest integrating detector — VERIFY
      intg_addl:
        - "andor_norm"                    # VERIFY — list all other integrating detectors

    # --- qRIXS (Archon CCD) — uncomment and comment out ChemRIXS blocks above ---
    # integrating_detectors:
    #   - "archon"                         # VERIFY ALIAS via run.detnames
    # get_intg:
    #   intg_main: "archon"

    # ── qRIXS: Pressio compression (BEFORE getROIs — order matters!) ──────────
    # Uncomment for qRIXS only. Must appear before getROIs in YAML.
    # getPressioCompression:
    #   archon:                            # VERIFY ALIAS
    #     compressor_id: "sz3"
    #     compressor_args:
    #       abs_error_bound: 10

    # ── ROI extraction ────────────────────────────────────────────────────────
    # writeArea: true is required for XESAnalyzer (saves 2D frame for projection).
    # Ask user for spectral stripe bounds.
    getROIs:
      # ChemRIXS: Andor VLS
      andor_vls:                           # VERIFY ALIAS
        - ROI: [[0, 1], [0, 1024]]         # FILL IN — ask user for spectral stripe bounds
          writeArea: true

      # qRIXS: Archon CCD — uncomment and update
      # archon:                            # VERIFY ALIAS
      #   - ROI: [[0, 1], [0, 4224]]       # Archon FVB: 4224 active pixels (4800 - 576 test pixels)
      #     writeArea: true

    # ── Beam intensity monitor (Wave8/FIM) ────────────────────────────────────
    # RIX has three Wave8 units; run `detnames -e exp=<exp>,run=<N>` to get exact alias.
    # epicsPV:
    #   - ["<wave8_alias>", "ipm"]        # VERIFY ALIAS — e.g. mr4k2, crix

    # ── Timetool (pump-probe only) ────────────────────────────────────────────
    # Uncomment when a pump laser is present.
    # ttCalib:
    #   ttCorr: "RIX:QRIX:ALV:01:TT:TTALL"   # FEX timetool output array

    # ── Scan variables ─────────────────────────────────────────────────────────
    # step_value and step_docstring are auto-generated by Bluesky — no setup needed.
    # For ATM timing delay, confirm lxt_ttc alias via detnames.

# ── XES/RIXS analysis ─────────────────────────────────────────────────────────
AnalyzeSmallDataXES:
  # SmallData HDF5 path — auto-populated from SubmitSMD result; leave empty
  smd_path: ""

  # Spectrometer alias — must match getROIs key above — VERIFY WITH USER
  xes_detname: "andor_vls"                # for qRIXS: replace with "archon"

  # IPM/Wave8 variable — VERIFY WITH USER via detnames -e
  ipm_var: ""                             # e.g. "mr4k2/sum" — run detnames -e to confirm format

  # Scan variable — VERIFY WITH USER
  # scan_var: "lxt_ttc"                  # uncomment and set; for energy scans use mono energy alias

  # Axis projection — false = project along axis 1 (columns)
  # invert_xes_axes: false               # uncomment if spectrum is transposed

  intensity_thresholds:
    # min_ipm: 1000.0                    # adjust to typical Wave8 signal range
    # min_Iscat: 10.0
