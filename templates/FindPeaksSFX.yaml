%YAML 1.3
---
# Description of the configuration or experiment
title: ""
# LCLS experiment name (e.g. mfxl1013621)
experiment: ""
# DAQ run number
run: ""
# Start date of analysis (YYYY/MM/DD)
date: ""
# LUTE version — do not change unless forcing an older version
lute_version: 0.2.0
# Timeout in seconds before the task is killed (should be less than the SLURM job timeout)
task_timeout: 600
# Main working directory — must exist and be writable; database and outputs land here
work_dir: ""
---
# ManagedTask: PeakFinderSFX / PeakFinderSFXXpp / PeakFinderSFXXppGpu (MPIExecutor)
# Performs Bragg peak finding on SFX data using the Peakfinder8 or PyAlgos algorithm.
# PeakFinderSFXXpp and PeakFinderSFXXppGpu source the XPP DRP environment (CPU and GPU resp.).
FindPeaksSFX:

  # Output directory for CXI hit files. Required.
  outdir: ""

  # Psana detector name storing the image data (e.g. "epix10k2M"). Required.
  det_name: ""

  # Event Receiver to use for timing: "evr0" or "evr1". Required.
  event_receiver: ""

  # PV name or numeric value for the camera length (detector distance in meters). Required.
  pv_camera_length: ""

  # Peak-finding algorithm: "Peakfinder8" (default), "Peakfinder8_v2", or "PyAlgos".
  algorithm: "Peakfinder8"

  # Tag string appended to output file names (useful as a run identifier). Default: ""
  tag: ""

  # Number of events to process. 0 processes all events. Default: 0
  # n_events:

  # Path to a CrystFEL geometry file. Required for Peakfinder8_v2; optional otherwise.
  # geometry_file:

  # Path to a custom mask file. No mask applied if null. Optional.
  # mask_file:

  # Apply psana's built-in detector mask. Default: false
  # psana_mask:

  # Minimum number of peaks per image to record as a hit. Default: 2
  # min_peaks:

  # Maximum number of peaks per image. Default: 2048
  # max_peaks:

  # Minimum number of pixels per peak. Default: 2
  # npix_min:

  # Maximum number of pixels per peak. Default: 30
  # npix_max:

  # Minimum ADC value threshold for starting a peak. Default: 80.0
  # amax_thr:

  # Minimum summed ADC threshold for a pixel to be collected into a peak. Default: 120.0
  # atot_thr:

  # Minimum signal-to-noise ratio for a group to be considered a peak. Default: 7.0
  # son_min:

  # Radius (pixels) within which the central pixel must be a local maximum. Default: 3
  # peak_rank:

  # Radius of the background evaluation ring (pixels). Default: 3.0
  # r0:

  # Width of the background evaluation ring (pixels). Default: 2.0
  # dr:

  # Intensity threshold for pixel inclusion in connected groups (in sigma). Default: 7.0
  # nsigm:

  # Enable event code filtering — only events matching event_code are processed. Default: false
  # Optional — most single-stream experiments do not need event filtering.
  # Enable when the DAQ records multiple interleaved shot types (e.g. dark frames, reference
  # shots) and only a specific subset should be searched for peaks.
  # event_logic:

  # Event code required for processing when event_logic is true. Default: 0
  # Optional — only used when event_logic is true. Set to the DAQ event code that identifies
  # the shot type to process (e.g. the laser-on event code for pump-probe experiments).
  # event_code:

  # Generate assembled powder plots in the eLog after processing. Default: true
  # make_powder_plots:

  # Path to the output peak list file.
  # Auto-populated to outdir/<experiment>_<run>_<tag>.list if left empty.
  # out_file:

  # SZ compression options. Leave commented to disable compression. Optional.
  # Optional — compression is off by default; CXI files are written uncompressed.
  # Enable when disk space is a concern and some loss of precision around peaks is acceptable.
  # "qoz" (quantized SZ) and "sz3" are lossy compressors; abs_error controls the maximum
  # per-pixel intensity error introduced by compression.
  # compression:
  #   compressor: "qoz"      # Compression algorithm: "qoz" or "sz3"
  #   abs_error: 10.0        # Absolute error bound for compression
  #   bin_size: 2            # Bin size
  #   roi_window_size: 9     # Window size for ROI-based compression
