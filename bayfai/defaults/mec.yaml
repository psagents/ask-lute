# BayFAI search defaults for MEC: four Epix10ka quads, fitted independently in one
# !param_sweep (bayfai_mec.dag.j2). Render context for bayfai.yaml.j2 and that DAG.
# Source: LUTE dev config/mec.yaml and workflows/common/bayfai_mec.dag (2026-11, lute#157).

# Base config. Each quad below overrides detname, fixed, center, bounds and bayfai_params.
# No `parallelized`: a quad's tilt is free, so ranks share one search space.
fixed: [rot1, rot3]

# Absolute [low, high] limits (metres, radians), not offsets. The validator rejects a
# free parameter whose center lies outside, so the base center and bounds are quad 0's.
bounds:
  dist: [0.258, 0.298]
  poni1: [0.055, 0.065]
  poni2: [0.055, 0.065]
  rot1: [-0.1, 0.1]
  rot2: [-0.65, -0.55]
  rot3: [-0.1, 0.1]

# Replaces the model dict whole, so all six keys.
resolutions:
  dist: 0.001
  poni1: 0.0001
  poni2: 0.0001
  rot1: 0.02
  rot2: 0.02
  rot3: 0.02

center: {dist: 0.278, poni1: 0.06, poni2: 0.06, rot1: 0.0, rot2: -0.6, rot3: 0.0}

detname_hint: Epix10kaQuad0

# Each quad sits at its own distance and tilt; the free tilt is the one the quad's
# placement leaves unconstrained. These centres are positions, not just guesses:
# re-check them with the instrument scientist if the quads were moved, and move the
# bounds with them. Bounds are center +- 20 mm dist, 5 mm poni, 0.05 rad free tilt:
# wider tilts reach geometries that fit the arcs to the wrong LaB6 rings and outscore
# the true one.
quads:
  - detname: Epix10kaQuad0
    fixed: [rot1, rot3]
    center: {dist: 0.278, poni1: 0.06, poni2: 0.06, rot1: 0.0, rot2: -0.6, rot3: 0.0}
    bounds: {dist: [0.258, 0.298], poni1: [0.055, 0.065], poni2: [0.055, 0.065], rot1: [-0.1, 0.1], rot2: [-0.65, -0.55], rot3: [-0.1, 0.1]}
    bayfai_params: {max_rings: 6}
  - detname: Epix10kaQuad1
    fixed: [rot1, rot3]
    center: {dist: 0.28, poni1: 0.079, poni2: -0.04, rot1: 0.0, rot2: -0.56, rot3: 0.0}
    bounds: {dist: [0.26, 0.3], poni1: [0.074, 0.084], poni2: [-0.045, -0.035], rot1: [-0.1, 0.1], rot2: [-0.61, -0.51], rot3: [-0.1, 0.1]}
    bayfai_params: {max_rings: 6}
  - detname: Epix10kaQuad2
    fixed: [rot2, rot3]
    center: {dist: 0.192, poni1: -0.0125, poni2: 0.0, rot1: 1.09, rot2: 0.0, rot3: 0.0}
    bounds: {dist: [0.172, 0.212], poni1: [-0.0175, -0.0075], poni2: [-0.005, 0.005], rot1: [1.04, 1.14], rot2: [-0.1, 0.1], rot3: [-0.1, 0.1]}
    bayfai_params: {max_rings: 10}
  - detname: Epix10kaQuad3
    fixed: [rot2, rot3]
    center: {dist: 0.1, poni1: -0.008, poni2: 0.04, rot1: -0.41, rot2: 0.0, rot3: 0.0}
    bounds: {dist: [0.08, 0.12], poni1: [-0.013, -0.003], poni2: [0.035, 0.045], rot1: [-0.46, -0.36], rot2: [-0.1, 0.1], rot3: [-0.1, 0.1]}
    bayfai_params: {max_rings: 10}

slurm:
  smd: "--nodes=4 --ntasks-per-node=50 --exclusive"
  bayfai: "--nodes=1 --ntasks-per-node=64"
