# BayFAI search defaults for CXI (jungfrau4M). Render context for bayfai.yaml.j2 and
# bayfai.dag.j2. Every value here is shown to the operator before rendering.
# Source: LUTE dev config/cxi.yaml (2026-11, lute#157) for the search shape; slurm
# from MFX (mfx101941027) -- unverified here.

# Split bounds.dist into one window per MPI rank. Without it every rank runs the
# same full search, differing only by seed.
parallelized: dist

# Tilts fixed for the first pass. With rot1/rot2 free the per-rank Cartesian grid is
# 5-D: 151 M points, ~19 GB per rank, out of memory on 119 ranks. Free them only for
# a refinement pass in a tight window.
fixed: [rot1, rot2, rot3]

# Absolute [low, high] limits. bounds.dist is the operator's `dist_bounds`, split
# geometrically across ranks (dist_spacing). The rest are the model's defaults, written
# out because a bounds dict replaces the model's whole and BayFAI reads every free key.
bounds:
  poni1: [-0.0025, 0.0025]
  poni2: [-0.0025, 0.0025]
  rot1: [-0.1, 0.1]
  rot2: [-0.1, 0.1]
  rot3: [-0.1, 0.1]

# No resolutions: the model's apply (lute#157, benchmarked on 67 + 41 datasets). Poni
# at its 0.0001 m is fine now: n_cand scores 8192 random grid points per step instead
# of the whole grid. min_points defaults to 100 for a dist sweep, so a few stray
# control points cannot win.

# Beam centre and tilts to start from. No dist: each rank starts at its own window.
center: {poni1: 0.0, poni2: 0.0, rot1: 0.0, rot2: 0.0, rot3: 0.0}

detname_hint: jungfrau4M

# Per DAG step. SmallData on 4 nodes is write-bound, not CPU-bound; BayFAI keeps one
# rank for LUTE, so 64 gives 63 search ranks.
slurm:
  smd: "--nodes=4 --ntasks-per-node=50 --exclusive"
  bayfai: "--nodes=1 --ntasks-per-node=64"
